<div class="listing-container">
  <div class="form-card">
    <h2>{{ isEditMode ? 'Edit Listing' : 'Create New Listing' }}</h2>

    <div class="success-message" *ngIf="successMessage">{{ successMessage }}</div>
    <div class="error-message" *ngIf="errorMessage">{{ errorMessage }}</div>

    <form (ngSubmit)="onSubmit()" #cropForm="ngForm">
      <div class="form-group">
        <label>Crop Type</label>
        <select [(ngModel)]="crop.cropType" name="cropType" (change)="onCropTypeChange()" required [disabled]="isEditMode">
          <option value="">Select type</option>
          <option *ngFor="let type of cropTypes" [value]="type">{{ type }}</option>
        </select>
      </div>

      <div class="form-group" *ngIf="crop.cropType">
        <label>Crop Name</label>
        <select [(ngModel)]="crop.cropName" name="cropName" (change)="onCropNameChange()" required [disabled]="isEditMode">
          <option value="">Select crop</option>
          <option *ngFor="let name of cropNames" [value]="name">{{ name }}</option>
          <option value="__other__">Other (Custom)</option>
        </select>
      </div>

      <div class="form-group" *ngIf="crop.cropName === '__other__'">
        <label>Enter Crop Name</label>
        <input type="text" [(ngModel)]="customCropName" name="customCropName" placeholder="Enter custom crop name" required [disabled]="isEditMode">
      </div>

      <div class="form-group" *ngIf="crop.cropName === '__other__'">
        <label>Crop Image URL (Optional)</label>
        <input type="url" [(ngModel)]="crop.imageUrl" name="imageUrl" placeholder="https://example.com/image.jpg" [disabled]="isEditMode">
      </div>

      <div class="form-row">
        <div class="form-group">
          <label>Quantity</label>
          <input type="number" [(ngModel)]="crop.quantity" name="quantity" required min="1">
        </div>

        <div class="form-group">
          <label>Unit</label>
          <select [(ngModel)]="crop.unit" name="unit" required [disabled]="isEditMode">
            <option value="kg">Kilogram (kg)</option>
            <option value="quintal">Quintal</option>
            <option value="ton">Ton</option>
          </select>
        </div>
      </div>

      <div class="form-group">
        <label>Price Per Unit (₹)</label>
        <input type="number" [(ngModel)]="crop.pricePerUnit" name="price" required min="0">
      </div>

      <div class="form-group">
        <label>Location</label>
        <textarea [(ngModel)]="crop.location" name="location" rows="3" required [disabled]="isEditMode"></textarea>
      </div>

      <div class="form-group">
        <label>Description</label>
        <textarea [(ngModel)]="crop.description" name="description" rows="4"></textarea>
      </div>

      <button type="submit" class="btn-green" [disabled]="!cropForm.valid">
        {{ isEditMode ? 'Update Listing' : 'Publish Listing' }}
      </button>
    </form>
  </div>
</div>
