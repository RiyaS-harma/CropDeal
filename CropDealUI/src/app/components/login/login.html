<section class="login-page">

  <!-- Left image panel -->
  <div class="login-image-panel">
    <img src="https://images.unsplash.com/photo-1625246333195-78d9c38ad449?w=1200" alt="Agriculture" />
  </div>

  <!-- Right form panel -->
  <div class="login-form-panel">
    <div class="login-box">

      <h1 class="brand">🌾 CropDeal</h1>
      <h2 class="login-title">Log in to your account</h2>

      <form (ngSubmit)="onSubmit()">
        <div class="form-group">
          <label>Email Address</label>
          <input type="email" [(ngModel)]="email" name="email" placeholder="Enter Email Address" required />
        </div>

        <div class="form-group">
          <label>Password</label>
          <input type="password" [(ngModel)]="password" name="password" placeholder="Enter Password" required />
        </div>

        <div class="forgot-link">
          <a routerLink="/forgot-password">Forgot Password?</a>
        </div>

        <div class="error-message" *ngIf="errorMessage">{{ errorMessage }}</div>

        <button type="submit" class="btn-login">Log In</button>
      </form>

      <hr class="divider" />

      <p class="register-link">Need an account? <a routerLink="/register">Create an account</a></p>

      <p class="copyright">&copy; 2026 CropDeal - Agricultural Trading Platform</p>

    </div>
  </div>

</section>
