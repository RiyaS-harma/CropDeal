<div class="forgot-wrapper">
  <div class="forgot-card">
    <div class="logo">🌾 CropDeal</div>

    <div class="notification success" *ngIf="message">{{ message }}</div>
    <div class="notification error" *ngIf="error">{{ error }}</div>

    <h2 *ngIf="step === 1">Reset Your Password</h2>
    <h2 *ngIf="step === 2">Verify OTP</h2>
    <h2 *ngIf="step === 3">Set New Password</h2>

    <p class="subtitle" *ngIf="step === 1">Enter your registered email to receive an OTP</p>
    <p class="subtitle" *ngIf="step === 2">Enter the OTP sent to your email</p>
    <p class="subtitle" *ngIf="step === 3">Create a new password for your account</p>

    <div *ngIf="step === 1">
      <div class="input-group">
        <input type="email" placeholder="Enter your registered email" [(ngModel)]="email" />
      </div>
      <button class="primary-btn" (click)="sendOTP()">Send OTP</button>
      <a routerLink="/login" class="back-link">← Back to Login</a>
    </div>

    <div *ngIf="step === 2">
      <div class="input-group">
        <input type="text" placeholder="Enter 6-digit OTP" [(ngModel)]="otp" maxlength="6" />
      </div>
      <button class="primary-btn" (click)="verifyOTP()">Verify OTP</button>
    </div>

    <div *ngIf="step === 3">
      <div class="input-group">
        <label>New Password</label>
        <input type="password" placeholder="Enter new password" [(ngModel)]="newPassword" (input)="checkStrength()" />
        <span class="strength" [ngClass]="passwordStrength">{{ passwordStrength }}</span>
      </div>
      <div class="input-group">
        <label>Confirm Password</label>
        <input type="password" placeholder="Confirm new password" [(ngModel)]="confirmPassword" />
      </div>
      <button class="primary-btn" (click)="resetPassword()">Reset Password</button>
    </div>
  </div>
</div>
