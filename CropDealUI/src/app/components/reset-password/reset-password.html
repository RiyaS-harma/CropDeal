<div class="reset-password-container">
  <div class="reset-password-card">
    <h2>🔐 Reset Password</h2>
    <form (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label>Email:</label>
        <input type="email" [(ngModel)]="email" name="email" readonly>
      </div>
      <div class="form-group">
        <label>New Password:</label>
        <input type="password" [(ngModel)]="newPassword" name="newPassword" required>
      </div>
      <div class="form-group">
        <label>Confirm Password:</label>
        <input type="password" [(ngModel)]="confirmPassword" name="confirmPassword" required>
      </div>
      <div class="success" *ngIf="message">{{ message }}</div>
      <div class="error" *ngIf="error">{{ error }}</div>
      <button type="submit" class="btn-submit">Reset Password</button>
      <a routerLink="/login" class="back-link">Back to Login</a>
    </form>
  </div>
</div>
